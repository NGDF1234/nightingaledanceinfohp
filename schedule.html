<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SCHEDULE | ナイチンゲールダンス非公式まとめサイト</title>
    <meta name="description" content="ナイチンゲールダンスのスケジュール一覧です。">
    <link rel="stylesheet" href="styles.css?v=88">
  </head>
  <body class="is-loading" data-schedule-mode="all">
    <div class="page-loader" id="page-loader" aria-live="polite" aria-label="読み込み中">
      <div class="loader-card">
        <img src="assets/header-logo-v3.jpg" alt="">
        <span>読み込み中</span>
      </div>
    </div>
    <header class="topbar">
      <a class="site-logo" href="index.html#top" aria-label="ホーム">
        <img src="assets/header-logo-v3.jpg" alt="ナイチンゲールダンス 非公式まとめサイト">
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html#top">HOME</a>
        <a href="index.html#news">NEWS</a>
        <a href="index.html#profile">PROFILE</a>
        <a href="index.html#regular">REGULAR</a>
        <a href="schedule.html">SCHEDULE</a>
        <a href="index.html#clips">CLIPS</a>
      </nav>
    </header>

    <main>
      <section class="schedule-section" id="schedule">
        <div class="section-title row-title">
          <div>
            <img class="heading-art heading-schedule-art" src="assets/heading-schedule-v86.png" alt="SCHEDULE スケジュール">
          </div>
          <a class="section-link-button" href="index.html#schedule">戻る →</a>
        </div>
        <form class="schedule-search" id="schedule-search-form" role="search">
          <label>
            <span>キーワード</span>
            <input id="schedule-title-search" type="search" autocomplete="off" placeholder="キーワード">
          </label>
          <label>
            <span>日付</span>
            <input id="schedule-date-from" type="date" aria-label="開始日">
          </label>
          <span class="range-separator">〜</span>
          <label>
            <span class="date-to-label">終了日</span>
            <input id="schedule-date-to" type="date" aria-label="終了日">
          </label>
        </form>
        <div class="schedule-list" id="schedule-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <p>このサイトは非公式まとめサイトです。公式情報は各公式ページで確認してください。</p>
      <small>AIによって作成されています。</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
