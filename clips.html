    <link rel="apple-touch-icon" href="assets/app-icon-v3.jpg">
    <link rel="stylesheet" href="styles.css?v=167">
  </head>
  <body class="is-loading" data-clips-mode="all">

      <span class="loader-motion" aria-hidden="true">
        <img src="assets/loader-frames/loader-frame-v112-1.png" alt="">
        <img src="assets/loader-frames/loader-frame-v112-2.png" alt="">

      </span>
    </div>
    <header class="topbar">
      <a class="site-logo" href="index.html#top" aria-label="ホーム">
        <img src="assets/header-logo-v3.jpg" alt="ナイチンゲールダンス 非公式まとめサイト">
      </a>
      <nav class="nav" aria-label="主なナビゲーション">
        <a href="index.html#news">NEWS</a>
        <a href="index.html#profile">PROFILE</a>
        <a href="index.html#regular">REGULAR</a>
        <a href="schedule.html">SCHEDULE</a>
        <a href="clips.html">CLIPS</a>
      </nav>
    </header>

    <main>
      <section class="schedule-section clips-list-section" id="clips">
        <div class="section-title row-title">
          <div>
            <h2>CLIPS</h2>
          </div>
          <a class="section-link-button" href="index.html#clips">戻る →</a>
        </div>
        <details class="list-search-toggle">
          <summary>検索条件</summary>
          <form class="clips-search" id="clips-search-form" role="search">
            <label>
              <span>キーワード</span>
              <input id="clips-keyword-search" type="search" autocomplete="off" placeholder="キーワード">
            </label>
            <details class="clips-detail-search">
              <summary>詳細検索</summary>
              <div class="clips-detail-search-body">
                <div class="schedule-date-range">
                  <label class="schedule-date-field">
                    <span>投稿日</span>
                    <input id="clips-date-from" type="date" aria-label="投稿日 開始日">
                  </label>
                  <span class="range-separator">〜</span>
                  <label class="schedule-date-field">
                    <span class="date-to-label">終了日</span>
                    <input id="clips-date-to" type="date" aria-label="投稿日 終了日">
                  </label>
                </div>
                <label>
                  <span>タイプ</span>
                  <select id="clips-kind-search">
                    <option value="">すべて</option>
                    <option value="video">動画</option>
                    <option value="shorts">ショート</option>
                  </select>
                </label>
                <div class="clips-duration-range">
                  <label>
                    <span>再生時間</span>
                    <select id="clips-duration-min" aria-label="再生時間 何分以上">
                      <option value="">指定なし</option>
                      <option value="1">1分以上</option>
                      <option value="3">3分以上</option>
                      <option value="5">5分以上</option>
                      <option value="10">10分以上</option>
                      <option value="15">15分以上</option>
                      <option value="30">30分以上</option>
                      <option value="60">60分以上</option>
                    </select>
                  </label>
                  <span class="range-separator">〜</span>
                  <label>
                    <span class="date-to-label">上限</span>
                    <select id="clips-duration-max" aria-label="再生時間 何分以下">
                      <option value="">指定なし</option>
                      <option value="1">1分以下</option>
                      <option value="3">3分以下</option>
                      <option value="5">5分以下</option>
                      <option value="10">10分以下</option>
                      <option value="15">15分以下</option>
                      <option value="30">30分以下</option>
                      <option value="60">60分以下</option>
                    </select>
                  </label>
                </div>
              </div>
            </details>
            <fieldset class="clips-channel-filter">
              <legend>チャンネル</legend>
              <label><input type="checkbox" name="clip-channel" value="combi_official" checked> ナイチンゲールダンスチャンネル</label>
              <label><input type="checkbox" name="clip-channel" value="nakano_personal" checked> 個人（中野）</label>
              <label><input type="checkbox" name="clip-channel" value="yasu_personal" checked> 個人（ヤス）</label>
              <label><input type="checkbox" name="clip-channel" value="other" checked> その他</label>
            </fieldset>
            <label class="clips-sort-field">
              <span>並べ替え</span>
              <select id="clips-sort-search">
                <option value="updated-desc">更新日時 降順</option>
                <option value="updated-asc">更新日時 昇順</option>
                <option value="popular">人気順</option>
              </select>
            </label>
            <p class="clips-result-count" id="clips-result-count" aria-live="polite"></p>
          </form>
        </details>
        <div class="clips-list" id="clips-list" aria-live="polite"></div>
      </section>
    </main>

    <div class="video-modal" id="video-modal" hidden>
      <div class="video-modal-backdrop" data-video-close></div>
      <div class="video-modal-panel" role="dialog" aria-modal="true" aria-label="YouTube動画">
        <button class="video-modal-close" type="button" data-video-close aria-label="閉じる">×</button>
        <div class="video-modal-frame" id="video-modal-frame"></div>
      </div>
    </div>

    <footer class="footer">
      <p>このサイトは、ナイチンゲールダンスに関する情報をまとめた非公式サイトです。</p>
      <p>最新・正確な情報については、各公式サイト・公式SNS等をご確認ください。</p>

    </footer>

</html>
